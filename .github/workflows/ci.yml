name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
  # Called by publish.yml, so nothing reaches npm without this passing.
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint and format
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      # Started through docker compose rather than a `services:` block so CI
      # runs the very same definition a developer runs locally — one file, no
      # drift between the two.
      - name: Start backing services
        run: pnpm services:up

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Stop backing services
        if: always()
        run: pnpm services:down

      - name: Build
        run: pnpm build
